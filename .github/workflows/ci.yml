name: CI — Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: configpanel
          POSTGRES_PASSWORD: configpanel_ci
          POSTGRES_DB: configpanel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Faz checkout do código
        uses: actions/checkout@v4

      - name: Configura o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instala dependências
        run: npm install

      - name: Roda as migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: configpanel
          DB_PASSWORD: configpanel_ci
          DB_NAME: configpanel_ci
        run: npm run migrate

      - name: Roda os testes
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: configpanel
          DB_PASSWORD: configpanel_ci
          DB_NAME: configpanel_ci
          JWT_SECRET: segredo-apenas-para-ci
          JWT_EXPIRES_IN: 8h
        run: npm test

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Faz checkout do código
        uses: actions/checkout@v4

      - name: Builda a imagem Docker
        run: docker build -t configpanel-backend:ci .

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: build-docker

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Faz checkout do código
        uses: actions/checkout@v4

      - name: Configura credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Builda, marca e envia a imagem pro ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: configpanel-backend
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:latest -t $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}