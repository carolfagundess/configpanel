services:

  postgres:
    image: postgres:16-alpine
    container_name: configpanel-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: configpanel-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node src/index.js"
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: configpanel-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: